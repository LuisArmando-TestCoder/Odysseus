<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-visual">
<title>Odysseus — Login</title>
<link rel="stylesheet" href="/static/css/auth-hyper.css">
<script nonce="{{CSP_NONCE}}">
(function(){
  // Per-theme bg-effect defaults — mirrors THEME_DEFAULT_* maps in
  // static/js/theme.js so login picks the same default pattern as the
  // main app for users who never explicitly chose one. Runs synchronously
  // so the palette + background pattern paint on the very first frame
  // (anti-FOUC) before the module controller boots.
  var THEME_DEFAULT_PATTERN = {
    dark:'none', light:'dots', midnight:'rain', paper:'dots',
    cyberpunk:'synapse', retrowave:'embers', forest:'petals',
    ocean:'constellations', terminal:'perlin-flow', organs:'rain',
    ume:'petals', cute:'sparkles'
  };
  var THEME_DEFAULT_EFFECT_COLOR = {
    midnight:'#ffffff', organs:'#451616', cute:'#ff8cb8', ume:'#f5a0c0'
  };
  var THEME_DEFAULT_INTENSITY = { midnight:0.5, terminal:0.8, organs:0.65 };
  try {
    var t = JSON.parse(localStorage.getItem('odysseus-theme'));
    var s = document.documentElement.style;
    if (t && t.colors) {
      var c = t.colors;
      s.setProperty('--bg', c.bg);
      s.setProperty('--fg', c.fg);
      s.setProperty('--panel', c.panel);
      s.setProperty('--border', c.border);
      if (c.red) s.setProperty('--red', c.red);
      if (c.green) s.setProperty('--green', c.green);
      var a = c.advanced || {};
      var ADV = {
        userBubbleBg:'--user-bubble-bg', aiBubbleBg:'--ai-bubble-bg',
        bubbleBorder:'--bubble-border', sidebarBg:'--sidebar-bg',
        brandColor:'--brand-color', hamburgerColor:'--hamburger-color',
        inputBg:'--input-bg', inputBorder:'--input-border',
        sendBtnBg:'--send-btn-bg', sendBtnHover:'--send-btn-hover',
        codeBg:'--code-bg', codeFg:'--code-fg', toggleActive:'--toggle-active',
      };
      for (var k in ADV) { if (a[k]) s.setProperty(ADV[k], a[k]); }
    }
    var name = (t && t.name) || '';
    var PATTERNS = ['dots','synapse','rain','constellations','petals','sparkles','embers'];
    var pattern = PATTERNS[Math.floor(Math.random() * PATTERNS.length)];
    var effColor = (t && t.bgEffectColor) || THEME_DEFAULT_EFFECT_COLOR[name] || '';
    var effInt = (t && t.bgEffectIntensity !== undefined)
      ? t.bgEffectIntensity
      : (THEME_DEFAULT_INTENSITY[name] !== undefined ? THEME_DEFAULT_INTENSITY[name] : 1);
    var effSize = (t && t.bgEffectSize !== undefined) ? t.bgEffectSize : 1;
    if (effColor) s.setProperty('--bg-effect-color', effColor);
    s.setProperty('--bg-effect-intensity', String(effInt));
    s.setProperty('--bg-effect-size', String(effSize));
    window.__loginBgPattern = pattern;
    var apply = function() { document.body.classList.add('bg-pattern-' + pattern); };
    if (document.body) apply();
    else document.addEventListener('DOMContentLoaded', apply, { once: true });
  } catch(e){}
})();
</script>
</head>
<body class="auth-body">
<div class="auth-aurora" aria-hidden="true"></div>
<div class="auth-sea" aria-hidden="true">
  <svg class="auth-sea-waves" viewBox="0 0 1440 220" preserveAspectRatio="none" aria-hidden="true" focusable="false">
    <path class="auth-wave auth-wave-back" d="M0,120 C240,60 480,180 720,120 C960,60 1200,180 1440,120 L1440,220 L0,220 Z"></path>
    <path class="auth-wave auth-wave-mid" d="M0,150 C240,90 480,210 720,150 C960,90 1200,210 1440,150 L1440,220 L0,220 Z"></path>
    <path class="auth-wave auth-wave-front" d="M0,180 C240,130 480,230 720,180 C960,130 1200,230 1440,180 L1440,220 L0,220 Z"></path>
  </svg>
  <svg class="auth-sea-boat" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M16 4L16 22L6 22Z" fill="currentColor"/><path d="M16 8L16 22L24 22Z" fill="currentColor" opacity="0.6"/><path d="M4 24Q10 20 16 24Q22 28 28 24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
</div>
<div class="auth-grain" aria-hidden="true"></div>
<main class="auth-card">
  <h1 class="auth-logo">
    <svg class="auth-logo-boat" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M16 4L16 22L6 22Z" fill="currentColor"/><path d="M16 8L16 22L24 22Z" fill="currentColor" opacity="0.6"/><path d="M4 24Q10 20 16 24Q22 28 28 24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg><span class="auth-logo-name">Odysseus</span>
  </h1>
  <p class="auth-tagline">Yours for the voyage.</p>
  <p class="auth-setup-note" id="setupNote" style="display:none"></p>

  <div class="auth-alert auth-alert-error" id="error" role="alert" aria-live="assertive"></div>

  <form id="authForm" class="auth-form" autocomplete="on">
    <div class="auth-field">
      <label class="auth-label" for="username">Username</label>
      <div class="auth-pw-wrap">
        <input id="username" name="username" type="text" class="auth-input" required autofocus autocomplete="username">
        <label class="auth-remember" id="rememberToggle" title="Remember me">
          <input type="checkbox" class="auth-check" id="remember" checked aria-label="Remember me">
          <span class="auth-dot" aria-hidden="true"></span>
        </label>
      </div>
    </div>

    <div class="auth-field">
      <label class="auth-label" for="password">Password</label>
      <div class="auth-pw-wrap">
        <input id="password" name="password" type="password" class="auth-input" required autocomplete="current-password">
        <button type="button" class="auth-eye" id="pwToggle" tabindex="-1" aria-label="Show password" aria-pressed="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><line x1="8" y1="16" x2="16" y2="8"/><line x1="8" y1="8" x2="16" y2="16"/></svg>
        </button>
      </div>
    </div>

    <div id="confirmGroup" style="display:none">
      <div class="auth-field">
        <label class="auth-label" for="confirmPassword">Confirm Password</label>
        <div class="auth-pw-wrap">
          <input id="confirmPassword" name="confirmPassword" type="password" class="auth-input" autocomplete="new-password">
          <button type="button" class="auth-eye" id="pwToggleConfirm" tabindex="-1" aria-label="Show password" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><line x1="8" y1="16" x2="16" y2="8"/><line x1="8" y1="8" x2="16" y2="16"/></svg>
          </button>
        </div>
      </div>
    </div>

    <button type="submit" id="submitBtn" class="auth-btn">Sign In</button>
  </form>

  <div class="auth-toggle-area" id="toggleArea" style="display:none">
    <span id="toggleText">Don't have an account? </span>
    <a id="toggleLink" class="auth-link" href="#">Sign up</a>
  </div>
</main>

<footer class="auth-version-label" id="version-label"></footer>

<script type="module" nonce="{{CSP_NONCE}}" src="/static/js/login.js"></script>
</body>
</html>
